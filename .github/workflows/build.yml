name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 安卓：出一个可以直接装的 APK
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      # --no-fatal-infos：info 级的风格提示不该把构建搞挂
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # iOS：打未签名的 ipa，拿证书重签之后就能装
  # （libimobiledevice 那套 Sideloadly / 爱思助手 都能签，或者 Xcode 里 AltSign）
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: 打包成未签名 ipa
        run: |
          set -e
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: Runner-unsigned.ipa

  # 打 tag 的时候顺手发个 Release，商店里直接下就行
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            Runner-unsigned.ipa
          generate_release_notes: true
